<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <meta
      name="description"
      content="Catálogo público de productos, sabores y toppings de Raffaelito."
    >
    <meta name="theme-color" content="#e05f5f">
    <meta name="color-scheme" content="light">
    <link rel="icon" href="/assets/img/logo.png">
    <title>Catálogo Raffaelito</title>
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="catalog-header">
        <div class="header-glow header-glow-primary" aria-hidden="true"></div>
        <div class="header-glow header-glow-secondary" aria-hidden="true"></div>

        <div class="brand-row">
          <div class="brand-lockup">
            <div class="brand-logo-shell">
              <img
                id="brand-logo"
                class="brand-logo"
                src="/assets/img/logo.png"
                alt="Raffaelito"
                width="72"
                height="72"
              >
            </div>
            <div>
              <h1 id="catalog-title">Raffaelito</h1>
            </div>
          </div>
        </div>
      </header>

      <main>
        <section
          id="status-banner"
          class="status-banner hidden"
          role="status"
          aria-live="polite"
        ></section>

        <section class="catalog-content" aria-label="Productos">
          <div id="catalog-loading" class="product-grid" aria-label="Cargando productos">
            <article class="skeleton-card" aria-hidden="true"></article>
            <article class="skeleton-card" aria-hidden="true"></article>
            <article class="skeleton-card" aria-hidden="true"></article>
            <article class="skeleton-card" aria-hidden="true"></article>
            <article class="skeleton-card" aria-hidden="true"></article>
            <article class="skeleton-card" aria-hidden="true"></article>
          </div>

          <div id="product-grid" class="product-grid hidden"></div>

          <div id="empty-state" class="empty-state hidden">
            <div class="empty-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M4 7h16l-1 13H5L4 7Z"></path>
                <path d="M8 7a4 4 0 0 1 8 0"></path>
              </svg>
            </div>
            <h3 id="empty-title">Aún no hay productos</h3>
            <p id="empty-message">Esta sede todavía no publicó productos.</p>
          </div>

          <div id="error-state" class="empty-state hidden" role="alert">
            <div class="empty-icon error-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M12 8v5"></path>
                <path d="M12 17h.01"></path>
                <path d="M10.3 3.7 2.7 17a2 2 0 0 0 1.7 3h15.2a2 2 0 0 0 1.7-3L13.7 3.7a2 2 0 0 0-3.4 0Z"></path>
              </svg>
            </div>
            <h3>No pudimos cargar la carta</h3>
            <p id="error-message">Revisa tu conexión e inténtalo nuevamente.</p>
            <button id="retry-button" type="button">Reintentar</button>
          </div>
        </section>
      </main>
    </div>

    <div id="product-dialog" class="dialog-layer hidden" aria-hidden="true">
      <button
        class="dialog-backdrop"
        id="dialog-backdrop"
        type="button"
        aria-label="Cerrar detalle"
      ></button>
      <section
        class="product-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="dialog-title"
      >
        <div class="dialog-grabber" aria-hidden="true"></div>
        <button id="dialog-close" class="dialog-close" type="button" aria-label="Cerrar">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="m7 7 10 10M17 7 7 17"></path>
          </svg>
        </button>
        <div id="dialog-image-wrap" class="dialog-image-wrap">
          <img id="dialog-image" alt="" decoding="async">
          <div id="dialog-image-placeholder" class="image-placeholder">
            <img src="/assets/img/logo.png" alt="">
          </div>
          <span id="dialog-sold-out" class="sold-out-badge hidden">Agotado</span>
        </div>
        <div class="dialog-content">
          <p id="dialog-category" class="product-category"></p>
          <h2 id="dialog-title"></h2>
          <p id="dialog-description" class="dialog-description"></p>

          <section id="dialog-sizes-section" class="detail-section hidden">
            <h3 class="detail-section-title">Tamaños y precios</h3>
            <div id="dialog-prices" class="dialog-prices"></div>
          </section>

          <section id="dialog-flavors-section" class="detail-section hidden">
            <div class="detail-section-heading">
              <h3 class="detail-section-title">Sabores</h3>
              <p id="dialog-flavors-limit" class="detail-section-note"></p>
            </div>
            <ul id="dialog-flavors" class="option-chip-list"></ul>
          </section>

          <section id="dialog-toppings-section" class="detail-section hidden">
            <h3 class="detail-section-title">Toppings</h3>
            <ul id="dialog-toppings" class="topping-list"></ul>
          </section>

          <p id="dialog-availability" class="availability-note"></p>
        </div>
      </section>
    </div>

    <noscript>
      <p class="noscript-message">
        Activa JavaScript para ver el catálogo actualizado.
      </p>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
